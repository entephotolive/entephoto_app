[versions]
agp                  = "9.2.1"
kotlin               = "2.4.10"
ksp                  = "2.3.11"
room                 = "2.8.4"
coreKtx              = "1.13.1"
appcompat            = "1.7.0"
material             = "1.12.0"
constraintlayout     = "2.1.4"
coordinatorlayout    = "1.2.0"
recyclerview         = "1.3.2"
lifecycleRuntime     = "2.8.4"
lifecycleService     = "2.8.4"
coroutines           = "1.8.1"
timber               = "5.0.1"
junit                = "4.13.2"
junitExt             = "1.2.1"
espresso             = "3.6.1"
composeBom           = "2024.06.00"
activityCompose      = "1.9.0"

[libraries]
androidx-core-ktx            = { group = "androidx.core",            name = "core-ktx",                version.ref = "coreKtx" }
androidx-appcompat           = { group = "androidx.appcompat",       name = "appcompat",               version.ref = "appcompat" }
material                     = { group = "com.google.android.material", name = "material",             version.ref = "material" }
androidx-constraintlayout    = { group = "androidx.constraintlayout", name = "constraintlayout",       version.ref = "constraintlayout" }
androidx-coordinatorlayout   = { group = "androidx.coordinatorlayout", name = "coordinatorlayout",      version.ref = "coordinatorlayout" }
androidx-recyclerview        = { group = "androidx.recyclerview",      name = "recyclerview",             version.ref = "recyclerview" }
room-runtime             = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
room-ktx                 = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
room-compiler            = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-lifecycle-runtime   = { group = "androidx.lifecycle",       name = "lifecycle-runtime-ktx",   version.ref = "lifecycleRuntime" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntime" }
androidx-lifecycle-service   = { group = "androidx.lifecycle",       name = "lifecycle-service",       version.ref = "lifecycleService" }
kotlinx-coroutines-android   = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-android", version.ref = "coroutines" }
timber                       = { group = "com.jakewharton.timber",   name = "timber",                  version.ref = "timber" }
junit                        = { group = "junit",                    name = "junit",                   version.ref = "junit" }
androidx-junit               = { group = "androidx.test.ext",        name = "junit",                   version.ref = "junitExt" }
androidx-espresso-core       = { group = "androidx.test.espresso",   name = "espresso-core",           version.ref = "espresso" }
androidx-compose-bom         = { group = "androidx.compose",         name = "compose-bom",             version.ref = "composeBom" }
androidx-compose-ui          = { group = "androidx.compose.ui",      name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui",      name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3   = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose    = { group = "androidx.activity",        name = "activity-compose",        version.ref = "activityCompose" }

[plugins]
android-application = { id = "com.android.application",   version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",       version.ref = "ksp" }

